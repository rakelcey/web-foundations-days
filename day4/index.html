<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter & Dark Mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Live Note Counter</h1>
    <button id="theme-toggle" type="button">Dark mode</button>
  </header>

  <main>
    <section>
      <form onSubmit="return false;">
        <div>
          <label for="note-text">Enter your note:</label>
          <textarea id="note-text" placeholder="Start typing..."></textarea>
        </div>

        <div>
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>

        <div>
          <button id="clear-btn" type="button">Clear</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
