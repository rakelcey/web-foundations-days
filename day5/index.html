<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>User Directory</h1>
  </header>

  <main>
    <section>
      <div>
        <button id="load-users" type="button">Load Users</button>
      </div>
      
      <div>
        <label for="filter-input">Filter users by name:</label>
        <input type="text" id="filter-input" placeholder="Type a name...">
      </div>

      <p id="status"></p>

      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
